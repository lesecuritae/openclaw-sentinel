name: Bug report
description: Report a reproducible defect (not a security vulnerability)
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, stop and use the private process in SECURITY.md."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal sanitized steps and configuration.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Docker and integration versions; remove private addresses and secrets.
