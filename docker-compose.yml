services:
  sentinel:
    build: .
    image: openclaw-sentinel:0.5.0
    restart: unless-stopped
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/sentinel.db}
      RULES_PATH: ${RULES_PATH:-/app/config/rules.yaml}
      POLICY_PATH: ${POLICY_PATH:-/app/config/policy.yaml}
      INTELLIGENCE_PATH: ${INTELLIGENCE_PATH:-/app/config/intelligence.yaml}
      HAPROXY_COLLECTOR_ENABLED: ${HAPROXY_COLLECTOR_ENABLED:-false}
      HAPROXY_SOCKET: ${HAPROXY_SOCKET:-/run/haproxy/admin.sock}
      HAPROXY_BLOCKLIST_PATH: ${HAPROXY_BLOCKLIST_PATH:-/etc/haproxy/sentinel-blocklist.lst}
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-5}
      HAPROXY_REQUEST_COLLECTOR_ENABLED: ${HAPROXY_REQUEST_COLLECTOR_ENABLED:-false}
      HAPROXY_REQUEST_HOST: ${HAPROXY_REQUEST_HOST:-0.0.0.0}
      HAPROXY_REQUEST_PORT: ${HAPROXY_REQUEST_PORT:-1514}
      ACTIONS_ENABLED: ${ACTIONS_ENABLED:-false}
      RESPONSE_DRY_RUN: ${RESPONSE_DRY_RUN:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      MODEL: ${MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434}
      ANUBIS_URL: ${ANUBIS_URL:-}
      CORS_ORIGIN_ALLOWLIST: ${CORS_ORIGIN_ALLOWLIST:-}
      DOCKER_COLLECTOR_ENABLED: ${DOCKER_COLLECTOR_ENABLED:-false}
      DOCKER_API_URL: ${DOCKER_API_URL:-}
      AUTH_COLLECTOR_ENABLED: ${AUTH_COLLECTOR_ENABLED:-false}
      SERVICE_LOG_COLLECTOR_ENABLED: ${SERVICE_LOG_COLLECTOR_ENABLED:-false}
      AUTH_LOG_PATHS: ${AUTH_LOG_PATHS:-/var/log/auth.log}
      SERVICE_LOG_PATH: ${SERVICE_LOG_PATH:-}
      WEB_2FA_ENABLED: ${WEB_2FA_ENABLED:-false}
      WEB_2FA_SECRET: ${WEB_2FA_SECRET:-}
      WEB_2FA_SECRET_FILE: ${WEB_2FA_SECRET_FILE:-}
      WEB_SESSION_TTL_SECONDS: ${WEB_SESSION_TTL_SECONDS:-900}
    volumes:
      - sentinel-data:/data
    ports:
      - "127.0.0.1:${SENTINEL_PORT:-8080}:8080"
      - "${HAPROXY_REQUEST_BIND:-127.0.0.1}:${HAPROXY_REQUEST_PORT:-1514}:1514/udp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sentinel-data:
