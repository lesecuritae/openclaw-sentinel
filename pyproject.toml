[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw-sentinel"
version = "0.1.5"
description = "Modular security intelligence and response core"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pip-audit>=2.9,<3", "pytest>=9.0.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["core", "collectors", "engine", "actions", "intelligence", "llm", "mcp", "database"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
