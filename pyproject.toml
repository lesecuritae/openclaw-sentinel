[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "openclaw-sentinel"
version = "0.5.0"
description = "Modular security intelligence and response core"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "PyYAML==6.0.3",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = ["pip-audit==2.10.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6"]

[tool.hatch.build.targets.wheel]
packages = ["core", "collectors", "engine", "actions", "intelligence", "llm", "mcp", "database"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
