rules:
  high_request_rate:
    event_types: [request]
    threshold: 100
    window: 60
    score: 20
  many_error_codes:
    statuses: [400, 401, 403, 404, 429, 500, 502, 503]
    threshold: 30
    window: 60
    score: 25
  failed_login:
    event_types: [failed_login]
    threshold: 20
    window: 60
    score: 30
  login_bruteforce:
    event_types: [request]
    methods: [POST]
    paths: [/login, /signin, /api/login, /api/auth, /identity/connect/token]
    threshold: 20
    window: 60
    score: 30
  scanner:
    paths: [/.env, /.git/config, /wp-admin, /admin, /phpmyadmin]
    threshold: 1
    window: 300
    score: 50
  scanner_pattern:
    event_types: [request]
    paths: [/.env, /.git/config, /wp-admin, /admin, /phpmyadmin, /login]
    distinct_by: path
    threshold: 4
    window: 60
    score: 30
  auth_bruteforce:
    event_types: [linux_auth_failed, vaultwarden_failed, nextcloud_failed, gitea_failed]
    threshold: 5
    window: 300
    score: 45
  docker_restart_loop:
    event_types: [docker_restart, docker_crash]
    threshold: 3
    window: 600
    score: 35
  docker_privileged:
    event_types: [docker_privileged]
    threshold: 1
    window: 60
    score: 55
  docker_unknown_container:
    event_types: [docker_create_unknown]
    threshold: 1
    window: 60
    score: 25
  docker_configuration_change:
    event_types: [docker_image_change, docker_port_change]
    threshold: 1
    window: 60
    score: 20
