global
  log stdout format raw local0

defaults
  mode http
  timeout connect 2s
  timeout client 5s
  timeout server 5s
  log-format '{"ip":"%ci","method":"%HM","path":"%HP","status":%ST,"service":"haproxy-test"}'

frontend test
  bind :8404
  log global
  default_backend service

backend service
  server testservice testservice:80 check
