global
  stats socket /tmp/haproxy.sock mode 600 level admin

defaults
  mode http
  timeout connect 2s
  timeout client 5s
  timeout server 5s

frontend test
  bind :8404
  acl scanner path -i /.env /.git/config /wp-admin /admin /phpmyadmin
  http-request deny deny_status 403 if scanner
  default_backend service

backend service
  server testservice testservice:80 check
