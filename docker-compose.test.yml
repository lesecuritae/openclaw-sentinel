name: openclaw-sentinel-e2e
services:
  sentinel:
    build: .
    environment:
      DATABASE_PATH: /data/sentinel.db
      RULES_PATH: /app/config/rules.yaml
      POLICY_PATH: /app/config/policy.yaml
      INTELLIGENCE_PATH: /app/config/intelligence.yaml
      SENTINEL_API_KEY: e2e-admin-fixture-credential-32-characters
      COLLECTOR_CREDENTIALS: '{"edge":{"token":"e2e-edge-fixture-credential-32-characters","source":"haproxy","event_types":["request"],"services":["haproxy-test"]},"docker":{"token":"e2e-docker-fixture-credential-32-characters","source":"docker","event_types":["docker_restart"],"services":["e2e-testservice"]}}'
      HAPROXY_COLLECTOR_ENABLED: "false"
      HAPROXY_REQUEST_COLLECTOR_ENABLED: "false"
      HAPROXY_REQUEST_HOST: 0.0.0.0
      HAPROXY_REQUEST_PORT: "1514"
      ACTIONS_ENABLED: "false"
      LLM_PROVIDER: disabled
    volumes: [sentinel-data:/data]
    expose: ["8080"]
    networks: [sentinel-test]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
  testservice:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    networks: [sentinel-test]
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1/]
      interval: 2s
      timeout: 2s
      retries: 10
  haproxy:
    image: haproxy:2.8@sha256:8baa7d29a27a7aa2c24c33819ad93a40d90b36a338b9f5c5806c537c79cfb105
    depends_on:
      sentinel: {condition: service_healthy}
      testservice: {condition: service_healthy}
    volumes: [./tests/test-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro]
    networks: [sentinel-test]
    ports: ["127.0.0.1:18404:8404"]
    healthcheck:
      test: [CMD, haproxy, -c, -f, /usr/local/etc/haproxy/haproxy.cfg]
      interval: 2s
      timeout: 3s
      retries: 10
  test-client:
    image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    profiles: [e2e]
    depends_on:
      haproxy: {condition: service_healthy}
      sentinel: {condition: service_healthy}
    environment:
      TARGET_URL: http://haproxy:8404
      SENTINEL_URL: http://sentinel:8080
      SENTINEL_KEY: e2e-admin-fixture-credential-32-characters
    volumes: [./tests/e2e_client.py:/e2e_client.py:ro]
    command: [python, /e2e_client.py]
    networks: [sentinel-test]
networks:
  sentinel-test:
    driver: bridge
volumes:
  sentinel-data:
